async function scheduleReminders(){
 const LN=window.Capacitor&&Capacitor.Plugins&&Capacitor.Plugins.LocalNotifications;
 if(!LN||S.remindOn===false)return;
 try{
  const perm=await LN.requestPermissions();
  const ok=perm&&(perm.display==="granted"||perm.granted===true);
  if(!ok)return;
  try{await LN.createChannel({id:"luoxi-med",name:"吃药提醒",description:"肿瘤治疗用药提醒",importance:5,visibility:1,vibration:true})}catch(e){}
  const pending=await LN.getPending();
  const old=((pending&&pending.notifications)||[]).filter(n=>n.id>=1000&&n.id<2000).map(n=>({id:n.id}));
  if(old.length)await LN.cancel({notifications:old});
  const list=S.meds.filter(m=>m.at&&m.remind!==false);
  if(!list.length)return;
  const notifications=list.map((m,i)=>{const p=(m.at||"08:00").split(":"),hh=+p[0]||8,mm=+p[1]||0;return{id:1000+i,title:"洛希守护 · 吃药提醒",body:"该吃「"+m.n+"」了"+(m.dose?"（"+m.dose+"）":""),schedule:{on:{hour:hh,minute:mm},allowWhileIdle:true},channelId:"luoxi-med",extra:{mid:String(m.id)}}});
  await LN.schedule({notifications});
 }catch(e){}}
async function enableReminders(){S.remindOn=true;save();await scheduleReminders();toast("已开启吃药提醒");render(true)}
const icsEsc=s=>String(s).replace(/\\/g,"\\\\").replace(/\n/g,"\\n").replace(/,/g,"\\,").replace(/;/g,"\\;");
function shareMedsIcs(){
  const list=S.meds.filter(m=>m.at&&m.remind!==false);
  if(!list.length){toast("先给药物填上每天的提醒时间");return}
  const now=new Date();
  const events=list.map(m=>{
    const p=(m.at||"08:00").split(":"),hh=+p[0]||0,mm=+p[1]||0;
    const passed=now.getHours()>hh||(now.getHours()===hh&&now.getMinutes()>=mm);
    const start=(passed?plus(today(),1):today()).replace(/-/g,"")+"T"+String(hh).padStart(2,"0")+String(mm).padStart(2,"0")+"00";
    return `BEGIN:VEVENT\nUID:${m.id}@luoxi\nDTSTART:${start}\nRRULE:FREQ=DAILY\nSUMMARY:${icsEsc("洛希守护 · "+m.n)}\nDESCRIPTION:${icsEsc("该吃"+m.n+(m.dose?"（"+m.dose+"）":""))}\nBEGIN:VALARM\nTRIGGER:PT0S\nACTION:DISPLAY\nDESCRIPTION:${icsEsc("该吃"+m.n)}\nEND:VALARM\nEND:VEVENT`;
  }).join("\n");
  const ics=`BEGIN:VCALENDAR\nVERSION:2.0\nPRODID:-//luoxi//cn//\nCALSCALE:GREGORIAN\n${events}\nEND:VCALENDAR\n`;
  const file=new File([ics],"洛希守护吃药提醒.ics",{type:"text/calendar"});
  if(navigator.canShare&&navigator.canShare({files:[file]})){navigator.share({files:[file],title:"吃药提醒"}).catch(e=>{if(!e||e.name!=="AbortError")downloadBlob(new Blob([ics],{type:"text/calendar"}),"洛希守护吃药提醒.ics")});return}
  downloadBlob(new Blob([ics],{type:"text/calendar"}),"洛希守护吃药提醒.ics");
  toast("已生成日历文件，打开后添加到日历");
}

function delNote(id){if(!confirm("删除这条记事和里面的照片？"))return;S.notes=(S.notes||[]).filter(x=>x.id!=id);save();render(true)}
function delFood(id){if(confirm("删除这一餐？")){F=F.filter(x=>x.id!=id);saveF();render(true)}}
function showImg(s){const d=document.createElement("div");d.style.cssText="position:fixed;inset:0;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;z-index:40";d.innerHTML=`<img src="${s}" style="max-width:96%;max-height:90%;border-radius:14px">`;d.onclick=()=>d.remove();document.body.appendChild(d)}

V.trend=()=>{let body="";const lst=(arr,key,fmt)=>`<div style="margin-top:8px">${arr.slice().reverse().slice(0,6).map(x=>`<div class="row" style="padding:7px 0;border-top:1px solid var(--line)"><span class="sub">${x.d}</span><b>${fmt(x)}</b><button class="btn ghost sm sp" onclick="delItem('${key}',${x.i})">删除</button></div>`).join("")}</div>`;
 const idx=a=>sorted(a.map((x,i)=>({...x,i})));
 if(seg=="mrd"){const a=sorted((S.mrd||[]).map(x=>({d:x.d,v:x.value==null?0:x.value,id:x.id,qual:x.qual,method:x.method})));body=`<div class="card"><h2>MRD 数值趋势</h2>${chart(a,"v")}<p class="sub">阴性通常记为 0。不同检测方法不可直接对比，以同一家实验室序列为准。</p><div style="margin-top:8px">${a.slice().reverse().map(x=>`<div class="row" style="padding:7px 0;border-top:1px solid var(--line)"><span class="sub">${x.d}</span><b>${esc(x.qual)}${x.v!=null&&x.qual!=="阴性"?" "+x.v:""}</b><button class="btn ghost sm sp" onclick="delMrd(${x.id})">删除</button></div>`).join("")}</div><button class="btn soft" style="margin-top:10px" onclick="sheetMrd()">录入 MRD</button></div>`}
 else if(seg=="temp"){const a=sorted(S.logs).filter(x=>x.temp!=null).map(x=>({d:x.d,v:x.temp}));body=`<div class="card"><h2>体温</h2>${chart(a,"v")}<p class="sub">免疫治疗期间请关注发热。≥${TEMP_ALERT}℃ 建议联系医生。</p><button class="btn soft" style="margin-top:10px" onclick="sheetTemp()">记体温</button></div>`}
 else if(seg=="weight"){const W=sorted(S.logs).filter(x=>x.w>0);body=`<div class="card"><h2>体重</h2>${chart(W.map(x=>({d:x.d,v:x.w})),"v")}<p class="sub">治疗期间体重变化因人而异，结合贫血与营养不良史，目标听肿瘤科/营养科。</p><button class="btn soft" style="margin-top:10px" onclick="sheetW()">记体重</button></div>`}
 else if(seg=="bp"){const a=idx(S.bp);body=`<div class="card"><h2>血压（收缩压）</h2>${chart(a,"sys")}<p class="sub">同时记录舒张压。以医院测量和医生判断为准。</p>${lst(a,"bp" ,x=>x.sys+"/"+x.dia)}<button class="btn soft" style="margin-top:10px" onclick="sheetBP()">记血压</button></div>`}
 else if(seg=="lab"){const a=idx(S.labs).filter(x=>x.k==labk),r=LAB[labk],groups=sorted(S.bloods).slice().reverse().slice(0,5);
 body=`<div class="card"><h2>化验趋势</h2><select onchange="labk=this.value;render(true)">${Object.keys(LAB).map(k=>`<option ${k==labk?"selected":""}>${k}</option>`).join("")}</select><div style="margin-top:8px">${chart(a,"v")}</div><p class="sub">常见参考 ${r[1]}–${r[2]} ${r[0]}，以化验单和医生判断为准。</p>${lst(a,"labs",x=>x.v+(labFlag(labk,x.v)?" · "+labFlag(labk,x.v):""))}<button class="btn soft" style="margin-top:10px" onclick="sheetBlood()">录入一组血检</button></div>
 ${groups.map(b=>`<div class="card"><div class="row"><h2 style="margin:0">${b.d}</h2><button class="btn ghost sm sp" onclick="delBlood(${b.id})">删除</button></div><p class="sub">${esc(b.hosp||"抽血")}${b.note?" · "+esc(b.note):""}</p>${b.items.map(i=>`<div class="row" style="padding:4px 0"><span>${esc(i.k)}</span><b class="sp">${i.v} ${LAB[i.k]?LAB[i.k][0]:""}${labFlag(i.k,i.v)?" · "+labFlag(i.k,i.v):""}</b></div>`).join("")}</div>`).join("")}`}
 else if(seg=="pro"){const a=Array.from({length:14},(_,i)=>addDays(i-13)).map(d=>({d,v:proOf(d)})).filter(x=>x.v>0);body=`<div class="card"><h2>蛋白质（克/天）</h2>${chart(a,"v")}<p class="sub">参考起点约 ${refPro()} 克（体重×1.1），治疗期请听营养科。</p></div>`}
 else if(seg=="mood"){const a=sorted(S.logs).filter(x=>x.mood!=null).slice(-14).map(x=>({d:x.d,v:x.mood/2}));body=`<div class="card"><h2>心情（1–5）</h2>${chart(a,"v")}</div>`}
 else{body=cal()}
 return `<div class="hd"><h1>趋势</h1><p>看 MRD、标志物和体重变化，复诊时带给医生</p></div><div class="seg">${SEGS.map(s=>`<span class="chip ${seg==s[0]?"on":""}" onclick="seg='${s[0]}';render(true)">${s[1]}</span>`).join("")}</div>${body}`};
function delItem(k,i){if(!confirm("删除这条记录？"))return;S[k].splice(i,1);save();render(true)}
function cal(){const p=prof(),n=new Date(),m0=new Date(Date.UTC(n.getFullYear(),n.getMonth()+cm,1)),ym=m0.getUTCFullYear()+"-"+String(m0.getUTCMonth()+1).padStart(2,"0"),off=m0.getUTCDay(),dim=new Date(Date.UTC(m0.getUTCFullYear(),m0.getUTCMonth()+1,0)).getUTCDate(),dx=(S.profile||{}).dxDate,surg=(S.profile||{}).surgDate,ev=new Set([...S.exams,...S.labs,...S.appt,...(S.mrd||[])].map(x=>x.d));
 let h=WK.map(x=>`<div class="h">${x}</div>`).join("")+"<div></div>".repeat(off);
 for(let i=1;i<=dim;i++){const d=ym+"-"+String(i).padStart(2,"0"),k=["c"];if(d==today())k.push("p");if(dx&&d==dx)k.push("o");if(surg&&d==surg)k.push("f");if(ev.has(d))k.push("ev");if(d==selD)k.push("sel");h+=`<div class="${k.join(" ")}" onclick="selD='${d}';render(true)">${i}</div>`}
 const onSel=S.appt.filter(a=>a.d==selD),ex=S.exams.filter(e=>e.d==selD),mr=(S.mrd||[]).filter(e=>e.d==selD);
 return `<div class="card"><h2>${esc(p.t)}</h2><p class="sub" style="margin-top:-6px">${esc(p.s)}</p><div class="row" style="justify-content:space-between;margin-bottom:8px"><button class="btn ghost sm" onclick="cm--;render(true)">‹</button><b>${ym}</b><button class="btn ghost sm" onclick="cm++;render(true)">›</button></div><div class="cal">${h}</div>
 <div class="lg"><span><i style="background:var(--rose2)"></i>今天</span><span><i style="background:var(--sage)"></i>确诊日</span><span><i style="background:var(--sage2)"></i>手术日</span><span><i style="background:var(--amb);border-radius:50%"></i>检查/MRD</span></div>
 <button class="btn soft" style="margin-top:10px" onclick="sheetProfile()">修改档案</button></div>
 <div class="card"><h2>${selD}</h2>${onSel.map(a=>`<p>📅 ${esc(a.t)}</p>`).join("")}${ex.map(e=>`<p>🧪 ${esc(e.t)}：${esc(e.r)}</p>`).join("")}${mr.map(e=>`<p>🧬 MRD：${esc(e.qual)}${e.value!=null&&e.qual!=="阴性"?" "+e.value+(e.unit||""):""}</p>`).join("")}${!onSel.length&&!ex.length&&!mr.length?'<p class="sub">这天还没有记录</p>':""}</div>`}
const AC=(k,t,b)=>`<details class="acc" ${acc.has(k)?"open":""} ontoggle="this.open?acc.add('${k}'):acc.delete('${k}')"><summary>${t}</summary><div class="in">${b}</div></details>`;
V.me=()=>{const up=S.appt.filter(a=>a.d>=today()).sort((a,b)=>a.d<b.d?-1:1),on=rfOn,u=RF.filter((r,i)=>on(i)&&r[1]).length,dn=RF.filter((r,i)=>on(i)&&!r[1]).length,ph=prof(),p=S.profile||{},bagN=BAG.filter(x=>S.bag&&S.bag[x]).length,recent=sorted(S.doses).slice(-8).reverse(),g=guideOf(ph.phase);

 ${AC("prof","🧬 患者档案",`<p><b>${esc(ph.name||"洛希")}</b> · ${esc(ph.t)}</p><p class="sub">${esc(ph.s)}</p><p class="sub">${p.lauren?esc(p.lauren)+" · ":""}HER2 ${esc(p.her2||"—")} · MSI ${esc(p.msi||"—")} · PD-L1 ${esc(p.pdl1||"—")}</p><p class="sub">Claudin18.2 ${esc(p.claudin||"—")} · TMB ${esc(p.tmb||"—")}</p>${p.note?`<p class="sub">${esc(p.note)}</p>`:""}<p style="margin:8px 0 0">${esc(g[1])}</p><button class="btn" onclick="sheetProfile()">填写 / 修改</button>`)}
 ${AC("care","📌 洛希专属提醒",`<ul style="margin:0;padding-left:18px;font-size:14px"><li>每天记：体温、大便颜色、吞咽/烧心、饮食蛋白、体重</li><li>MRD 阳性 + 影像阴性：按医嘱做 FDG+FAPI，不要自行解读</li><li>替吉奥曾诱发尿路样反应，若再用务必提前告知医生</li><li>奥沙利铂曾有黏液/白冻样便反应，可记在大便里</li><li>右肺磨玻璃结节为独立 MIA，PET 前务必告知读片医生</li><li>贫血、甲减、营养不良：关注血红蛋白、TSH、白蛋白</li><li>卵巢处理存在专家分歧，MDT 时带上这份摘要</li></ul>`)}
 ${AC("rx","⚠️ 既往用药反应",`${(S.reacts||[]).map((x,i)=>`<div class="row" style="padding:7px 0"><div style="flex:1"><b>${esc(x.n)}</b><div class="sub">${x.d||""} · ${esc(x.r)}</div></div><button class="btn ghost sm" onclick="S.reacts.splice(${i},1);save();render(true)">删除</button></div>`).join("")||'<p class="sub">暂无</p>'}<div class="row" style="margin-top:8px"><input id="rxn" placeholder="药物" style="flex:1"><input id="rxr" placeholder="反应" style="flex:1.4"></div><button class="btn soft big" onclick="addReact()">添加反应</button>`)}
 ${AC("mrd","🧪 MRD 记录",`${sorted(S.mrd||[]).slice().reverse().map(x=>`<div class="row" style="padding:7px 0"><div style="flex:1"><b>${x.d}</b><div class="sub">${esc(x.method||"")} · ${esc(x.qual)}${x.value!=null&&x.qual!=="阴性"?" "+x.value+(x.unit||""):""}</div></div><button class="btn ghost sm" onclick="delMrd(${x.id});render(true)">删除</button></div>`).join("")||'<p class="sub">循环肿瘤 DNA / MRD 可按次记录，趋势页可看曲线。</p>'}<button class="btn" onclick="sheetMrd()">＋ 录入 MRD</button>`)}
 ${AC("ex","🩻 影像与病理",`${sorted(S.exams).slice().reverse().map(e=>{const i=S.exams.indexOf(e);return `<div class="row" style="padding:7px 0"><div style="flex:1"><b>${esc(e.t)}</b><div class="sub">${e.d} · ${esc(e.r)}</div></div><button class="btn ghost sm" onclick="delExam(${i})">删除</button></div>`}).join("")||'<p class="sub">CT、PET、胃镜、病理结论可以记在这里。</p>'}<button class="btn" onclick="dp.type='exam';sheetData()">＋ 记一次检查</button>`)}
 ${AC("med","💊 药物与吃药提醒",`${S.meds.map(m=>`<div class="item" onclick="sheetMed(${m.id})"><div style="flex:1"><div class="nm">${esc(m.n)}</div><div class="sub">${m.at?m.at+" 提醒 · ":""}${esc(m.t)}${m.dose?" · "+esc(m.dose):""}${m.remind===false?" · 不提醒":""}</div></div><span class="tag">${esc(m.c)}</span></div>`).join("")||'<p class="sub">暂无</p>'}<div class="row" style="margin-top:12px"><button class="btn" onclick="sheetMed()">＋ 添加药物</button><button class="btn soft" onclick="addCommonMeds()">添加示例用药</button></div><p class="sub">点常用药名可快速填入。导出文件含全部记录，可再导入回来。</p><div class="row"><button class="btn soft" onclick="backupData()">保存到文件</button><button class="btn soft" onclick="pickImport()">导入记录</button></div>${(window.Capacitor&&Capacitor.isNativePlatform&&Capacitor.isNativePlatform())?`<button class="btn big" onclick="enableReminders()">开启系统吃药提醒</button><p class="sub">保存带时间的药物后会每天推送。</p>`:`<button class="btn big" onclick="shareMedsIcs()">把吃药时间加到日历</button><p class="sub">iPhone 日历会到点提醒。打开洛希守护也能看到今天吃了没有。</p>`}`)}
 ${AC("dose","📒 用药记录",`${recent.map(x=>`<div class="row" style="padding:6px 0"><div style="flex:1"><b>${esc(x.n)}</b><div class="sub">${x.d} ${x.t}${x.dose?" · "+esc(x.dose):""}${x.note?" · "+esc(x.note):""}</div></div><button class="btn ghost sm" onclick="delDose(${x.id})">删除</button></div>`).join("")||'<p class="sub">打卡或点“记一次药”会出现在这里</p>'}<button class="btn soft big" onclick="sheetDose()">＋ 记一次用药</button>`)}
 ${AC("bl","🩸 血化验记录",`${sorted(S.bloods).slice().reverse().slice(0,6).map(b=>`<div class="card" style="margin:8px 0;box-shadow:none"><div class="row"><b>${b.d}</b><button class="btn ghost sm sp" onclick="delBlood(${b.id})">删除</button></div><p class="sub">${esc(b.hosp||"")}${b.note?" · "+esc(b.note):""}</p>${b.items.map(i=>`<div class="row"><span>${esc(i.k)}</span><span class="sp">${i.v}${labFlag(i.k,i.v)?" · "+labFlag(i.k,i.v):""}</span></div>`).join("")}</div>`).join("")||'<p class="sub">把一次抽血的多项结果一起记下来</p>'}<button class="btn" onclick="sheetBlood()">＋ 录入血检</button>`)}
 ${AC("bag","🧳 复诊/住院清单 "+bagN+"/"+BAG.length,`<button class="btn soft" onclick="sheetBag()">打开清单</button>`)}
 ${AC("ap","📅 复诊预约",`${up.map(a=>`<div class="row" style="padding:7px 0"><div style="flex:1"><b>${esc(a.t)}</b><div class="sub">${a.d}</div></div><span class="tag g">${diff(today(),a.d)||"今"}天${diff(today(),a.d)?"后":""}</span><button class="btn ghost sm" onclick="S.appt=S.appt.filter(x=>x.id!=${a.id});save();render(true)">删除</button></div>`).join("")||'<p class="sub">暂无即将到来的预约</p>'}<div class="row" style="margin-top:10px"><input id="ad" type="date" style="flex:1"><input id="at" placeholder="项目，如 肿瘤内科复诊" style="flex:1.2"></div><button class="btn soft big" onclick="addAppt()">添加预约</button>`)}
 ${AC("in","⚠️ 过敏 / 不能吃的东西",`${S.intol.map((x,i)=>`<div class="row" style="padding:6px 0"><span style="flex:1">${esc(x)}</span><button class="btn ghost sm" onclick="S.intol.splice(${i},1);save();render(true)">删除</button></div>`).join("")||'<p class="sub">暂无</p>'}<div class="row" style="margin-top:8px"><input id="ii" placeholder="例如 海鲜：皮疹" style="flex:1"><button class="btn soft" onclick="addIntol()">添加</button></div>`)}
 ${AC("ai","✨ AI 整理",`<p class="sub" style="margin-top:0">根据你的记录整理趋势、要留意的点和复诊时可问医生的问题。不做诊断，不推荐药物。</p><button class="btn" id="aib" onclick="runAI()">生成整理</button><div id="aio"></div>`)}
 ${AC("rf","🧭 治疗要点清单",`<p class="sub" style="margin-top:0">勾选当前适用的项目，方便告诉医生，不是预测。</p>${RF.map((r,i)=>`<div class="item ${on(i)?"done":""}" onclick="S.risk[${i}]=${!on(i)};save();render(true)"><div class="ck">${on(i)?"✓":""}</div><div style="flex:1">${r[0]}</div><span class="tag ${r[1]?"a":"g"}">${r[1]?"需告知医生":"常规"}</span></div>`).join("")}<p style="margin:10px 0 0">需告知 <b>${u}</b> 项 · 常规 <b>${dn}</b> 项</p>`)}

function addAppt(){if(!$("ad").value||!$("at").value.trim()){toast("请填日期和项目");return}S.appt.push({id:Date.now(),d:$("ad").value,t:$("at").value.trim()});save();render(true)}
function addIntol(){const v=$("ii").value.trim();if(!v)return;S.intol.push(v);save();render(true)}
function addReact(){const n=$("rxn").value.trim(),r=$("rxr").value.trim();if(!n||!r){toast("请填药物和反应");return}S.reacts=S.reacts||[];S.reacts.push({d:today(),n,r});save();render(true)}
function labTxt(){return Object.keys(LAB).map(k=>{const a=sorted(S.labs.filter(x=>x.k==k)),z=a[a.length-1];return z?`${k} ${z.v}${LAB[k][0]}${labFlag(k,z.v)?"（"+labFlag(k,z.v)+"）":""} ${z.d}`:null}).filter(Boolean).join("；")||"暂无"}
function mrdTxt(){return sorted(S.mrd||[]).map(x=>`${x.d} ${x.method||""} ${x.qual}${x.value!=null&&x.qual!=="阴性"?" "+x.value+(x.unit||""):""}${x.note?" "+x.note:""}`).join("\n")||"暂无"}
function sum(){const L=sorted(S.logs).slice(-5),pr=prof(),p=S.profile||{};return `【复诊摘要】生成日期 ${today()}\n\n■ 档案\n${pr.name||""}；${pr.t}；${pr.s}\n${p.lauren?p.lauren+"；":""}HER2 ${p.her2||"—"} · MSI ${p.msi||"—"} · PD-L1 ${p.pdl1||"—"}\nClaudin18.2 ${p.claudin||"—"} · TMB ${p.tmb||"—"}\n${p.note||""}\n\n■ 既往用药反应\n${(S.reacts||[]).map(x=>`${x.d||""} ${x.n}：${x.r}`).join("\n")||"暂无"}\n\n■ MRD\n${mrdTxt()}\n\n■ 近期检查\n${sorted(S.exams).reverse().map(e=>`${e.d} ${e.t}：${e.r}`).join("\n")||"暂无"}\n\n■ 血化验\n${labTxt()}\n\n■ 血压\n${sorted(S.bp).slice(-5).map(x=>`${x.d} ${x.sys}/${x.dia}`).join("\n")||"暂无"}\n\n■ 当前药物\n${S.meds.map(x=>`${x.n}（${x.c}，${x.t}${x.at?"，提醒 "+x.at:""}${x.dose?"，"+x.dose:""}）`).join("\n")||"暂无"}\n\n■ 过敏\n${S.intol.join("\n")||"暂无"}\n\n■ 预约\n${S.appt.map(a=>a.d+" "+a.t).join("\n")||"暂无"}\n\n■ 近期状态\n${L.map(x=>`${x.d} ${x.w?"体重"+x.w+"kg ":""}${x.temp!=null?"体温"+x.temp+"℃ ":""}${x.stool?"大便"+x.stool+" ":""}${x.swallow!=null?"吞咽"+x.swallow+" ":""}${x.sys?"血压"+x.sys+"/"+x.dia+" ":""}${x.pain!=null?"疼痛"+x.pain+" ":""}${x.mood!=null?"心情"+x.mood/2+"/5 ":""}${x.sym&&x.sym.length?x.sym.join("、"):""}`).join("\n")||"暂无"}\n\n■ 系统提醒\n${alerts().map(a=>a[1]).join("\n")||"无"}\n\n■ 想问医生\n1. \n2. `}
function famTxt(){const T=today(),A=alerts(),l=sorted(S.logs).filter(x=>x.w>0).pop(),lg=S.logs.find(x=>x.d==T)||{},a=S.appt.filter(x=>x.d>=T).sort((x,y)=>x.d<y.d?-1:1)[0],pr=prof(),lm=latestMrd();return `【${T} 洛希守护简报】\n${pr.name||"洛希"}：${pr.t}\nMRD：${lm?mrdLabel(lm):"暂无"}\n整体：${A.some(x=>x[0]=="alert")?"需要尽快联系医生":A.length?"有几项需要留意":"今天看起来还平稳"}\n今日用药：${S.meds.filter(m=>m.done[T]).length}/${S.meds.length} 已打卡\n今日蛋白质：${proOf(T)}/${refPro()} 克\n体温：${lg.temp!=null?lg.temp+"℃":"未记"} · 大便：${lg.stool||"未记"} · 吞咽：${lg.swallow!=null?lg.swallow:"未记"}\n${l?`最近体重（${l.d}）：${l.w}kg`:"最近没有体重记录"}\n需要关注：${A.map(x=>x[1]).join("；")||"无"}\n下次复诊：${a?a.d+" "+a.t:"暂无"}\n（来自洛希守护，仅供家人了解，不代替医生意见）`}

async function exportRpt(){let dl=null;try{dl=typeof claude!=="undefined"?await claude.use("downloads"):null}catch(e){}

 const tb=(h,rows)=>`<table><tr>${h.map(x=>`<th>${x}</th>`).join("")}</tr>${rows.map(r=>`<tr>${r.map(x=>`<td>${esc(x)}</td>`).join("")}</tr>`).join("")}</table>`;
 const html=`<!DOCTYPE html><html lang="zh-CN"><head><meta charset="utf-8"><title>洛希守护报告 ${today()}</title><style>body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;max-width:720px;margin:24px auto;padding:0 16px;color:#222}h1{font-size:22px}h2{font-size:16px;border-bottom:1px solid #ccc;padding-bottom:4px;margin-top:22px}table{border-collapse:collapse;width:100%;font-size:13px}th,td{border:1px solid #ccc;padding:4px 8px;text-align:left}pre{white-space:pre-wrap;font-family:inherit;font-size:13px}p{font-size:12px;color:#666}</`+`style></head><body><h1>洛希守护 · 复诊摘要</h1><p>生成日期 ${today()}。以下为自行记录，仅供就诊参考。打开后用浏览器“打印”可另存为 PDF。</p><h2>档案</h2><pre>${esc(prof().t+"；"+prof().s)}</pre><h2>MRD</h2><pre>${esc(mrdTxt())}</pre><h2>检查</h2>${tb(["日期","项目","结论"],sorted(S.exams).map(x=>[x.d,x.t,x.r]))}<h2>化验</h2>${tb(["日期","项目","数值","标记"],sorted(S.labs).map(x=>[x.d,x.k,x.v,labFlag(x.k,x.v)]))}<h2>血压</h2>${tb(["日期","收缩压","舒张压"],sorted(S.bp).map(x=>[x.d,x.sys,x.dia]))}<h2>近14天状态</h2>${tb(["日期","体重","血压","疼痛","体力","食欲","心情","睡眠h","蛋白质g","症状"],sorted(S.logs).slice(-14).map(x=>[x.d,x.w||"",x.sys?x.sys+"/"+x.dia:"",x.pain!=null?x.pain:"",x.en||"",x.ap||"",x.mood||"",x.sl||"",proOf(x.d)||"",(x.sym||[]).join("、")]))}<h2>摘要</h2><pre>${esc(sum())}</pre></body></html>`;
 try{await dl.save({filename:"洛希守护报告-"+today()+".html",data:html})}catch(e){if(!e||e.code!="declined")toast("保存失败")}}
async function runAI(){const o=$("aio"),b=$("aib");let sample=null;try{sample=typeof claude!=="undefined"?await claude.use("sample"):null}catch(e){}
 if(!sample){o.innerHTML='<pre style="margin-top:10px">当前环境不支持 AI 整理。</pre>';return}
 b.disabled=true;o.innerHTML='<pre style="margin-top:10px">正在整理…</pre>';
 const pr=prof();
 const data={profile:pr,mrd:S.mrd||[],exams:S.exams,labs:S.labs,bp:S.bp,appointments:S.appt,meds:S.meds.map(m=>({n:m.n,c:m.c,t:m.t,takenDays:Object.keys(m.done).slice(-7)})),intolerance:S.intol,logs:sorted(S.logs).slice(-14),meals:F.filter(x=>x.d>=addDays(-7)).map(x=>({d:x.d,meal:x.meal,foods:x.foods,txt:x.txt,pro:x.pro})),ruleAlerts:alerts().map(a=>a[1]),notesChecked:RF.filter((r,i)=>rfOn(i)).map(r=>r[0])};
 const q='你是实体瘤（含胃癌等）患者自我管理工具里的整理助手。下面是患者自己记录的数据（JSON）。请用中文、通俗、温和的语言输出，且只输出 JSON：{"trend":"3句以内的趋势概述","watch":["需要留意的点，最多4条"],"ask_doctor":["复诊时可问医生的问题，最多5条"],"care_notes":["用药、营养、MRD、症状方面的观察，最多3条"]}。严格规则：不下诊断，不预测生存或复发结局，不推荐具体药物、剂量或停药换药；数据不足时直说；出现黑便/便血、高热、黄疸、剧烈腹痛、气促等时提醒尽快就医；情绪连续低落时温和建议寻求支持；所有结论都提醒由肿瘤科医生判断。\n数据：'+JSON.stringify(data);
 try{const r=await sample.json(q,{cache:false}),L=a=>(a||[]).map(x=>`<li>${esc(x)}</li>`).join("");
  o.innerHTML=`<div style="background:var(--lav2);border-radius:16px;padding:12px;margin-top:10px;font-size:14px"><b>趋势</b><p style="margin:2px 0 8px">${esc(r.trend||"")}</p><b>需要留意</b><ul>${L(r.watch)}</ul><b>想问医生</b><ul>${L(r.ask_doctor)}</ul><b>日常观察</b><ul>${L(r.care_notes)}</ul><p class="sub">由 AI 根据你的记录整理，可能有误，请以医生判断为准。</p></div>`}
 catch(e){o.innerHTML='<pre style="margin-top:10px">'+(e&&e.code=="not_granted"?"未授权使用 AI。":"生成失败，请稍后再试。")+'</pre>'}b.disabled=false}
function resetDemo(){if(confirm("将清除现有记录（含饮食照片）并恢复示例数据，继续吗？")){S=demo();F=[];save();saveF();scheduleReminders();render()}}
function bakMeta(){try{return JSON.parse(lsGet(LS+"_bak")||"{}")}catch(e){return{}}}
function setBakMeta(m){lsSet(LS+"_bak",JSON.stringify(m))}
function backupEvery(){const n=bakMeta().every;return n==null?3:n}
function backupDue(){const m=bakMeta(),every=backupEvery();if(!every||fresh)return false;if(m.snooze&&m.snooze>today())return false;const anchor=m.at||m.start;if(!anchor)return false;return diff(anchor,today())>=every}
function backupCard(){if(!backupDue())return"";const m=bakMeta(),txt=m.at?`距离上次把记录存到文件已经 ${diff(m.at,today())} 天。`:"记录还只在这台手机里。";return `<div class="card" style="background:#fff1d6"><h2>该备份了</h2><p style="margin:0">${txt}如果清掉了离线数据，只有存进「文件」的备份能找回来。iPhone 不能在后台自己写文件，点一下即可。</p><div class="row" style="margin-top:10px"><button class="btn" onclick="backupData()">保存到文件</button><button class="btn soft" onclick="snoozeBak()">3天后再说</button></div></div>`}
function snoozeBak(){const m=bakMeta();m.snooze=addDays(3);setBakMeta(m);render(true);toast("3 天后再提醒")}
function setEvery(n){const m=bakMeta();m.every=n;setBakMeta(m);render(true);toast(n?`每 ${n} 天提醒一次`:"已关闭自动提醒")}
function markBak(){const m=bakMeta();m.at=today();m.snooze="";if(!m.start)m.start=today();setBakMeta(m)}
function bakPanel(){const m=bakMeta(),every=backupEvery(),when=m.at?("上次存到文件："+m.at):"还没有存到文件",chip=(n,t)=>`<span class="chip ${every==n?"on":""}" onclick="setEvery(${n})">${t}</span>`;return `<p class="sub" style="margin-top:0">记录保存在这台${dbReady?"手机的 SQLite":idb?"手机":"浏览器"}里，不会上传。清掉网站数据或删掉主屏幕图标后，手机里的记录会消失。打开应用时，如果距离上次保存超过设定天数，会提醒你把全部记录存进 iPhone「文件」，可以放进 iCloud。</p><p class="sub">${when}</p><div class="seg">${chip(3,"每3天")}${chip(7,"每7天")}${chip(0,"不提醒")}</div><div class="row" style="margin-top:10px"><button class="btn" onclick="backupData()">保存到文件</button><button class="btn soft" onclick="pickImport()">导入记录</button></div><button class="btn soft" style="margin-top:10px" onclick="sheetSnaps()">恢复本机副本</button><p class="sub">本机副本只防误删，和记录存在同一处。清掉数据后副本也没了。</p><button class="btn ghost" style="margin-top:10px" onclick="resetDemo()">恢复示例数据</button>`}
function keepSnap(){if(!idb||fresh)return;clearTimeout(keepSnap.t);keepSnap.t=setTimeout(async()=>{try{let arr=[];try{arr=JSON.parse(await idbGet("snaps")||"[]")}catch(e){}arr=Array.isArray(arr)?arr.filter(x=>x&&x.d!==today()):[];arr.push({d:today(),S:JSON.parse(JSON.stringify(S)),F:JSON.parse(JSON.stringify(F))});while(arr.length>3)arr.shift();try{await idbPut("snaps",JSON.stringify(arr))}catch(e){const slim=arr.slice(-2).map(x=>({d:x.d,S:x.S,F:(x.F||[]).map(f=>{const y=Object.assign({},f);y.imgs=[];return y})}));try{await idbPut("snaps",JSON.stringify(slim))}catch(e2){}}}catch(err){}},1500)}
async function sheetSnaps(){let arr=[];try{arr=JSON.parse(await idbGet("snaps")||"[]")}catch(e){}if(!idb){toast("当前环境没有本机副本");return}if(!Array.isArray(arr)||!arr.length){toast("还没有本机副本，记一笔后会自动留下");return}sheet("本机副本",arr.slice().reverse().map(x=>`<div class="row" style="padding:8px 0"><span style="flex:1">${x.d}</span><button class="btn soft sm" onclick="restoreSnap('${x.d}')">恢复</button></div>`).join("")+'<p class="sub">这些副本和记录在同一台手机里。清掉网站数据后会一起消失。</p>')}
function restoreSnap(d){idbGet("snaps").then(raw=>{let arr=[];try{arr=JSON.parse(raw||"[]")}catch(e){}const x=arr.find(i=>i.d===d);if(!x){toast("找不到这份副本");return}if(!confirm("用 "+d+" 的副本覆盖现在的记录？"))return;S=x.S;F=x.F||[];fresh=false;save();saveF();closeSheet();render();toast("已恢复 "+d+" 的副本")}).catch(()=>toast("读取副本失败"))}
function downloadBlob(blob,name){const a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove()}
function pickImport(){let el=$("imp");if(!el){el=document.createElement("input");el.type="file";el.id="imp";el.accept="application/json,.json";el.onchange=()=>restoreData(el);document.body.appendChild(el)}el.click()}
async function backupData(){
  const blob=new Blob([JSON.stringify({v:1,exported:today(),S,F})],{type:"application/json"});
  const name="洛希守护备份-"+today()+".json";
  const file=new File([blob],name,{type:"application/json"});
  try{
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:name});
      markBak();
      if(tab==="today"||tab==="me")render(true);
      toast("备份已交出，请确认选了「存储到文件」");
      return;
    }
  }catch(e){
    if(e&&e.name==="AbortError")return;
  }
  downloadBlob(blob,name);
  markBak();
  if(tab==="today"||tab==="me")render(true);
  toast("已开始下载，请到「文件」里确认这份备份");
}
function restoreData(inp){
  const f=inp.files&&inp.files[0];inp.value="";if(!f)return;
  const r=new FileReader();
  r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!o.S)throw 0;if(!confirm("用这份备份覆盖这台手机上的记录？"))return;hydrate(JSON.stringify(o.S),JSON.stringify(o.F||[]));fresh=false;save();saveF();markBak();render();toast("已恢复备份")}catch(e){toast("无法读取这份备份")}};
  r.readAsText(f);
}
function hasCancerData(S){return S&&(S.profile&&(S.profile.cancer||S.profile.stage||S.profile.dxDate)||(S.mrd&&S.mrd.length)||(S.meds&&S.meds.some(m=>/靶向|免疫|化疗|曲妥珠|替吉奥|单抗|MRD|PD-1|PD-L1/.test((m.n||"")+(m.c||"")))))}
function isPregnancyData(S){if(!S)return false;if(hasCancerData(S))return false;if(S.preg&&S.preg.lmp)return true;if(S.kicks&&S.kicks.length)return true;if(S.meds&&S.meds.length&&S.meds.every(m=>/叶酸|钙剂|铁剂|DHA|维生素D/.test(m.n||""))&&!S.profile)return true;return false}
function hydrate(stateRaw,foodRaw){
  try{S=JSON.parse(stateRaw||"null")}catch(e){S=null}
  try{F=JSON.parse(foodRaw||"[]")}catch(e){F=[]}
  const isOldDemo=S&&S.profile&&S.profile.dxDate==="2024-06-12"&&S.profile.surgDate==="2024-07-20";
  if(!S||isPregnancyData(S)||isOldDemo){S=demo();fresh=true;F=[{id:1,d:today(),t:"08:10",meal:"早餐",txt:"小米粥半碗、蒸蛋",foods:["鸡蛋","杂粮主食"],pro:10,imgs:[]}]}
  ["exams","meds","reacts","intol","logs","appt","labs","bp","doses","bloods","notes","mrd"].forEach(k=>S[k]=S[k]||[]);S.risk=S.risk||{};S.profile=S.profile||{cancer:"胃癌",stage:"",phase:"",dxDate:"",surgDate:"",her2:"",msi:"",pdl1:"",name:"",lauren:"",claudin:"",tmb:"",note:""};S.bag=S.bag||{};if(S.remindOn==null)S.remindOn=true;if(!S.v)S.v=2;
}
(async()=>{
  let stateRaw=lsGet(LS),foodRaw=lsGet(LSF);
  try{
    await dbInit();
    if(dbReady){
      const ds=await dbGet("state"),df=await dbGet("food");
      if(ds)stateRaw=ds;
      if(df!=null)foodRaw=df;
    }
  }catch(e){dbReady=false}
  if(!dbReady){
    try{
      idb=await idbOpen();
      const ds=await idbGet("state"),df=await idbGet("food");

      if(df!=null)foodRaw=df;
      if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});

  if(!fresh){const m=bakMeta();if(!m.start){m.start=today();setBakMeta(m)}}
  if(dbReady||idb){save();saveF()}

  render();
  scheduleReminders();
  if(securePage()&&"serviceWorker"in navigator){
    navigator.serviceWorker.register("sw.js").then(()=>navigator.serviceWorker.ready).then(async()=>{
      const cache=await caches.open("luoxi-v4");
      let hit=await cache.match("./")||await cache.match("index.html");
      if(!hit){
        const res=await fetch("index.html",{cache:"reload"});
        if(res.ok){await cache.put("./",res.clone());await cache.put("index.html",res.clone());hit=true}

      offlineOK=!!hit;

})();
